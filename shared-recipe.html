  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/recipes.js?v=32"></script>
  <script type="module">
    import {
      db, auth, provider, signInWithPopup,
      collection, doc, getDoc, getDocs, addDoc, query, where, serverTimestamp
    } from './js/firebase-config.js';
    import { getUser, getAllRegisteredUsers, authReady } from './js/auth.js';
    import { saveUserRecipe } from './js/user-recipes.js';

    let globalRecipe = null;
    let currentServings = 1;
    let senderNameFromUrl = '';
    let lastSavedRecipeId = null;

    function decodeRecipeFromUrl(str) {
      if (!str) return null;
      try {
        let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const jsonStr = new TextDecoder().decode(bytes);
        return JSON.parse(jsonStr);
      } catch (e) {
        console.warn('Falha ao decodificar receita da URL:', e);
        return null;
      }
    }

    async function fetchSharedRecipeFromFirestore(recipeId, senderUid, shareDocId) {
      // 1. Tenta pelo documento direto em shared_recipes/{shareDocId}
      if (shareDocId) {
        try {
          const sSnap = await getDoc(doc(db, 'shared_recipes', shareDocId));
          if (sSnap.exists() && sSnap.data().recipeData) {
            return sSnap.data().recipeData;
          }
        } catch (e) {}
      }

      // 2. Tenta na coleção my_recipes do remetente (users/{senderUid}/my_recipes/{recipeId})
      if (senderUid && recipeId) {
        try {
          const directSnap = await getDoc(doc(db, 'users', senderUid, 'my_recipes', recipeId));
          if (directSnap.exists()) {
            return { ...directSnap.data(), id: directSnap.id };
          }
        } catch (e) {}

        try {
          const colSnap = await getDocs(collection(db, 'users', senderUid, 'my_recipes'));
          const found = colSnap.docs.find(d => d.id === recipeId || d.data().id === recipeId);
          if (found) return { ...found.data(), id: found.id };
        } catch (e) {}

        try {
          const outSnap = await getDocs(collection(db, 'users', senderUid, 'outbox'));
          const foundOut = outSnap.docs.find(d => d.data().recipeId === recipeId && d.data().recipeData);
          if (foundOut) return foundOut.data().recipeData;
        } catch (e) {}
      }

      // 3. Tenta buscar em shared_recipes por recipeId
      if (recipeId) {
        try {
          const q = query(collection(db, 'shared_recipes'), where('recipeId', '==', recipeId));
          const qSnap = await getDocs(q);
          for (const d of qSnap.docs) {
            if (d.data().recipeData) return d.data().recipeData;
          }
        } catch (e) {}

        // 4. Varre usuários registrados em busca da receita
        try {
          const allUsers = await getAllRegisteredUsers();
          for (const u of allUsers) {
            if (!u.uid) continue;
            try {
              const dSnap = await getDoc(doc(db, 'users', u.uid, 'my_recipes', recipeId));
              if (dSnap.exists()) return { ...dSnap.data(), id: dSnap.id };
            } catch (e) {}
          }
        } catch (e) {}
      }

      return null;
    }

    async function resolveSharedRecipe() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      const senderUid = params.get('u') || '';
      const shareDocId = params.get('s') || '';
      senderNameFromUrl = params.get('from') || '';

      if (senderNameFromUrl) {
        const senderLabel = document.getElementById('sender-label');
        if (senderLabel) senderLabel.textContent = `Enviada por ${senderNameFromUrl}`;
      }

      // A. Extrai payload do hash (#r=...) ou query (?r=...)
      let hashPayload = '';
      if (window.location.hash && window.location.hash.startsWith('#r=')) {
        hashPayload = window.location.hash.slice(3);
      } else if (params.get('r')) {
        hashPayload = params.get('r');
      }
      const urlRecipe = decodeRecipeFromUrl(hashPayload);

      // B. Tenta carregar também do Firestore ou arquivos estáticos para ter a foto completa caso tenha sido omitida da URL
      let remoteRecipe = null;
      if (id && window.loadRecipe) {
        try {
          remoteRecipe = await window.loadRecipe(id);
        } catch (e) {}
      }
      if (!remoteRecipe && (id || senderUid || shareDocId)) {
        try {
          await Promise.race([authReady, new Promise(r => setTimeout(r, 1500))]);
          remoteRecipe = await fetchSharedRecipeFromFirestore(id, senderUid, shareDocId);
        } catch (e) {}
      }

      if (urlRecipe && remoteRecipe) {
        return {
          ...urlRecipe,
          ...remoteRecipe,
          image: remoteRecipe.image || remoteRecipe.imageUrl || urlRecipe.image || 'images/hero_bg.png',
          ingredients: (remoteRecipe.ingredients && remoteRecipe.ingredients.length) ? remoteRecipe.ingredients : (urlRecipe.ingredients || []),
          steps: (remoteRecipe.steps && remoteRecipe.steps.length) ? remoteRecipe.steps : (urlRecipe.steps || [])
        };
      }

      return remoteRecipe || urlRecipe || null;
    }

    function renderIngredientsList() {
      if (!globalRecipe) return '';
      const cleanPrepMethods = (str) => {
        if (!str) return '';
        return String(str)
          .replace(/\b(cortad[ao]s?(\s+ao\s+meio|\s+em\s+[^\s,]+|\s+ao\s+comprido)?)\b/gi, '')
          .replace(/\b(picad[ao]s?(\s+finamente|\s+bem|\s+em\s+[^\s,]+)?)\b/gi, '')
          .replace(/\b(ralad[ao]s?(\s+bem|\s+no\s+ralo\s+[^\s,]+)?)\b/gi, '')
          .replace(/\b(fatiad[ao]s?)\b/gi, '')
          .replace(/\b(amassad[ao]s?)\b/gi, '')
          .replace(/\b(derretid[ao]s?)\b/gi, '')
          .replace(/\b(cozid[ao]s?)\b/gi, '')
          .replace(/\b(desfiad[ao]s?)\b/gi, '')
          .replace(/\b(moíd[ao]s?|moid[ao]s?)\b/gi, '')
          .replace(/\b(grelhad[ao]s?)\b/gi, '')
          .replace(/\b(descascad[ao]s?)\b/gi, '')
          .replace(/\b(triturad[ao]s?)\b/gi, '')
          .replace(/\b(refogad[ao]s?)\b/gi, '')
          .replace(/\b(assad[ao]s?)\b/gi, '')
          .replace(/\b(peneirad[ao]s?)\b/gi, '')
          .replace(/\b(polvilhad[ao]s?)\b/gi, '')
          .replace(/\b(pincelad[ao]s?)\b/gi, '')
          .replace(/\b(em\s+cubos?|em\s+rodelas?|em\s+tiras?|em\s+lascas?|em\s+pedaços?|em\s+gomos?|em\s+quadrados?|em\s+fatias?|em\s+ramos?)\b/gi, '')
          .replace(/^[\s,.\-–—]+|[\s,.\-–—]+$/g, '')
          .replace(/\s+/g, ' ')
          .trim();
      };

      return (globalRecipe.ingredients || []).map(ing => {
        if (!ing) return '';
        const isObj = typeof ing === 'object' && ing !== null;
        let rawName = isObj ? (ing.item || ing.name || ing.title || '') : String(ing);
        const upper = rawName.trim().toUpperCase();

        const isHeader = (isObj && (ing.isHeader || ing.header || ing.section || ing.type === 'section'))
          || upper.startsWith('PARA ')
          || upper.startsWith('MOLHO')
          || upper.startsWith('MASSA')
          || upper.startsWith('RECHEIO')
          || upper.startsWith('COBERTURA')
          || rawName.trim().endsWith(':')
          || (isObj && (!ing.amount || ing.amount.trim() === '') && (upper.includes('PARA O') || upper.includes('PARA A') || upper.includes('PARA AS') || upper.includes('PARA OS')));

        if (isHeader) {
          const headerTitle = isObj ? (ing.title || ing.section || ing.header || ing.item || '') : ing;
          const cleanTitle = headerTitle.replace(/^[\s:]+|[\s:]+$/g, '');
          return `
            <div style="font-size:12px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:#6b7ef0; margin:22px 0 10px 0; padding-top:14px; border-top:2px dashed #ece5d9;">
              ${cleanTitle}
            </div>`;
        }

        let name = isObj ? (ing.item || '') : ing;
        let rawAmount = isObj ? (ing.amount || '') : '';
        name = cleanPrepMethods(name);
        rawAmount = cleanPrepMethods(rawAmount);

        if (!isObj && name) {
          const m = name.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)\s*(.*)$/);
          if (m) {
            rawAmount = m[1];
            name = m[2];
          }
        }

        let scaledAmount = rawAmount;
        if (rawAmount) {
          const match = rawAmount.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)\s*(.*)$/);
          if (match) {
            let numText = match[1].replace(',', '.');
            let num = 0;
            if (numText.includes(' ')) {
              const parts = numText.split(' ');
              const intPart = parseFloat(parts[0]);
              const fracParts = parts[1].split('/');
              num = intPart + (parseFloat(fracParts[0]) / parseFloat(fracParts[1]));
            } else if (numText.includes('/')) {
              const parts = numText.split('/');
              num = parseFloat(parts[0]) / parseFloat(parts[1]);
            } else {
              num = parseFloat(numText);
            }

            if (!isNaN(num)) {
              let scaledNum = Math.round(num * currentServings * 100) / 100;
              let intPart = Math.floor(scaledNum);
              let fracPart = scaledNum - intPart;
              const tolerance = 0.03;
              if (Math.abs(fracPart - 0) < tolerance) fracPart = 0;
              else if (Math.abs(fracPart - 0.25) < tolerance) fracPart = 0.25;
              else if (Math.abs(fracPart - 0.33) < tolerance) fracPart = 0.33;
              else if (Math.abs(fracPart - 0.5) < tolerance) fracPart = 0.5;
              else if (Math.abs(fracPart - 0.67) < tolerance) fracPart = 0.67;
              else if (Math.abs(fracPart - 0.75) < tolerance) fracPart = 0.75;
              else if (Math.abs(fracPart - 1) < tolerance) { fracPart = 0; intPart++; }

              let scaledStr = '';
              if (fracPart === 0) scaledStr = intPart.toString();
              else if (fracPart === 0.25) scaledStr = intPart > 0 ? `${intPart}&ensp;1/4` : `1/4`;
              else if (fracPart === 0.33) scaledStr = intPart > 0 ? `${intPart}&ensp;1/3` : `1/3`;
              else if (fracPart === 0.5) scaledStr = intPart > 0 ? `${intPart}&ensp;1/2` : `1/2`;
              else if (fracPart === 0.67) scaledStr = intPart > 0 ? `${intPart}&ensp;2/3` : `2/3`;
              else if (fracPart === 0.75) scaledStr = intPart > 0 ? `${intPart}&ensp;3/4` : `3/4`;
              else scaledStr = scaledNum.toString().replace('.', ',');

              scaledAmount = `${scaledStr} ${match[2]}`.trim();
            }
          }
        }

        scaledAmount = cleanPrepMethods(scaledAmount);
        return `
          <div class="sig-ingredient-row" style="display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid #ece5d9">
            <div class="ing-left" style="display:flex; align-items:center; gap:10px">
              <span class="ing-dot" style="width:8px; height:8px; border-radius:50%; background:#ffbf00; flex-shrink:0"></span>
              <span style="font-size:15px; font-weight:500; color:#14110d">${name}</span>
            </div>
            ${scaledAmount ? `<span style="font-size:15px; font-weight:800; color:#8a6a00; white-space:nowrap; text-align:right">${scaledAmount}</span>` : ''}
          </div>`;
      }).join('');
    }

    function updateServings(delta) {
      if (!globalRecipe) return;
      const newServings = currentServings + delta;
      if (newServings < 1) return;
      currentServings = newServings;

      const baseServings = parseInt(globalRecipe.servings, 10) || 1;
      const totalYield = currentServings * baseServings;

      const scDisplay = document.getElementById('serving-count-display');
      if (scDisplay) scDisplay.textContent = currentServings;

      const rendimento = document.getElementById('meta-rendimento');
      if (rendimento) rendimento.textContent = totalYield + ' porç.';

      const yieldText = document.getElementById('yield-display');
      if (yieldText) {
        yieldText.textContent = currentServings === 1
          ? `1 receita rende ${totalYield} porções`
          : `${currentServings} receitas rendem ${totalYield} porções`;
      }

      document.getElementById('sig-ingredient-list').innerHTML = renderIngredientsList();
    }

    function renderLandingPage(recipe) {
      globalRecipe = recipe;
      currentServings = 1;

      document.title = `${recipe.title} — Receita Compartilhada`;
      document.getElementById('meta-desc').setAttribute('content', recipe.subtitle || '');

      const desktopCategoriesHtml = (recipe.categories || []).map(c =>
        `<span style="background:#fff0f3; color:#c72a50; border-radius:999px; padding:7px 15px; font-size:12px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase">${c}</span>`
      ).join('');

      const desktopTagsHtml = (recipe.tags || []).map(t =>

              <div class="recipe-steps-column">

                <div style="display:flex; flex-direction:column; gap:16px">
                  ${(() => {
                    let mainStepIndex = 0;
                    const parsedSteps = [];
                    let currentGroup = null;

                    (recipe.steps || []).forEach(rawStep => {
                      const stepStr = (rawStep || '').toString();
                      const isSub = stepStr.startsWith('\t') ||
                                    stepStr.startsWith('  ') ||
                                    /^\d+\.\d+[\s\.]/.test(stepStr) ||
                                    /^[a-z][\.\)]\s/i.test(stepStr);

                      let cleanText = stepStr
                        .replace(/^[\t\s]+/, '')
                        .replace(/^\d+\.\d+[\s\.]*/, '')
                        .replace(/^[a-z][\.\)]\s*/i, '');

                      if (isSub && currentGroup) {
                        currentGroup.subs.push(cleanText);
                      } else {
                        mainStepIndex++;
                        currentGroup = { index: mainStepIndex, main: cleanText, subs: [] };
                        parsedSteps.push(currentGroup);
                      }
                    });

                    return parsedSteps.map(group => {
                      const mainHtml = `
                        <div class="idv-step-item" onclick="this.classList.toggle('completed')" style="display:flex; align-items:center; gap:16px; background:#fff; border:2px solid #ece5d9; border-radius:22px; padding:18px 24px; cursor:pointer; transition:all 0.25s; box-shadow:0 2px 8px rgba(0,0,0,0.02); z-index:2; position:relative;">
                          <div class="step-num" style="width:40px; height:40px; border-radius:12px; background:#fff6d9; color:#8a6a00; font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.3s">${group.index}</div>
                          <p style="margin:0; font-size:17px; line-height:1.5; color:#14110d; font-weight:600; text-wrap:pretty; transition:all 0.3s">${group.main}</p>
                        </div>
                      `;

                      if (group.subs.length === 0) return mainHtml;

                      const subsHtml = group.subs.map((subText, i) => {
                        const letter = String.fromCharCode(97 + (i % 26));
                        return `
                          <div style="position:relative; display:flex; align-items:center;">
                            <div class="idv-step-item sub-step" onclick="this.classList.toggle('completed')" style="flex:1; display:flex; align-items:center; gap:14px; background:#f7f4ee; border:1.5px solid #ece5d9; border-radius:18px; padding:14px 20px; cursor:pointer; transition:all 0.25s; box-shadow:0 2px 6px rgba(0,0,0,0.01);">
                              <div class="step-num" style="width:32px; height:32px; border-radius:10px; background:#fff; border:1.5px solid #ece5d9; color:#8a6a00; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;">${letter}</div>
                              <p style="margin:0; font-size:16px; line-height:1.5; color:#2b2620; font-weight:500; text-wrap:pretty;">${subText}</p>
                            </div>
                          </div>
                        `;
                      }).join('');

                      const subCount = group.subs.length;
                      return `
                        <div style="display:flex; flex-direction:column; gap:12px;">
                          ${mainHtml}
                          <div class="sub-steps-wrapper" style="position:relative; margin-left:36px; padding-left:24px; display:flex; flex-direction:column; gap:12px;">
                            <div style="position:absolute; left:0; top:-12px; bottom:0; width:24px; pointer-events:none;">
                              <svg width="24" height="100%" style="width:100%; height:100%; overflow:visible;">
                                <line x1="1" y1="0" x2="1" y2="${(subCount - 1) * 74 + 32}" stroke="#6b6459" stroke-width="2" stroke-linecap="square" />
                                ${group.subs.map((_, i) => {
                                  const centerY = i * 74 + 42;
                                  return `<path d="M 1 ${centerY - 10} Q 1 ${centerY} 12 ${centerY} L 22 ${centerY}" fill="none" stroke="#6b6459" stroke-width="2" stroke-linecap="round" />`;
                                }).join('')}
                              </svg>
                            </div>
                            ${subsHtml}
                          </div>
                        </div>
                      `;
                    }).join('');
                  })()}
                </div>
              </div>
            </div>
          </section>
        </article>
      `;

      const stickyBar = document.getElementById('mobile-sticky-bar');
      if (stickyBar) stickyBar.style.display = '';

    async function handleAddSharedRecipeToMySite() {
      if (!globalRecipe) return;

      const mainBtn = document.getElementById('main-add-to-site-btn');
      const stickyBtn = document.getElementById('mobile-sticky-add-btn');
      [mainBtn, stickyBtn].forEach(b => {
        if (b) {
          b.disabled = true;
          b.innerHTML = '<span>⏳</span><span>Adicionando ao seu site...</span>';
        }
      });

      try {
        const baseId = (globalRecipe.id || 'receita').replace(/^shared_\d+_/, '');
        const newId = `shared_${Date.now()}_${baseId}`;

        const recipeCopy = {
          ...globalRecipe,
          id: newId,
          title: globalRecipe.title || 'Receita Compartilhada',
          subtitle: globalRecipe.subtitle || (senderNameFromUrl ? `Recebida de ${senderNameFromUrl}` : 'Receita compartilhada'),
          image: globalRecipe.image || globalRecipe.imageUrl || 'images/hero_bg.png',
          imageUrl: globalRecipe.imageUrl || globalRecipe.image || 'images/hero_bg.png',
          cuisine: globalRecipe.cuisine || 'Brasileira',
          difficulty: globalRecipe.difficulty || 'Médio',
          prepTime: globalRecipe.prepTime || 15,
          cookTime: globalRecipe.cookTime || 15,
          totalTime: globalRecipe.totalTime || globalRecipe.prepTime || 30,
          servings: globalRecipe.servings || 2,
          categories: Array.isArray(globalRecipe.categories) && globalRecipe.categories.length ? globalRecipe.categories : ['Almoço'],
          tags: Array.isArray(globalRecipe.tags) ? globalRecipe.tags : [],
          nutrition: globalRecipe.nutrition || { calories: globalRecipe.calories || '350', protein: '15g', carbs: '35g', fat: '12g' },
          ingredients: Array.isArray(globalRecipe.ingredients) ? globalRecipe.ingredients : [],
          steps: Array.isArray(globalRecipe.steps) ? globalRecipe.steps : [],
          isUserCreated: true,
          createdAt: new Date().toISOString()
        };

        // 1. Salva no localStorage imediatamente
        const localRecipes = JSON.parse(localStorage.getItem('receitas_isa_user_recipes')) || [];
        localRecipes.unshift(recipeCopy);
        localStorage.setItem('receitas_isa_user_recipes', JSON.stringify(localRecipes));
        lastSavedRecipeId = newId;

        // 2. Se estiver logado no Firebase, salva também no Firestore (my_recipes)
        const user = getUser();
        if (user) {
          try {
            const firestoreId = await saveUserRecipe(recipeCopy);
            if (firestoreId) {
              lastSavedRecipeId = firestoreId;
              recipeCopy.id = firestoreId;
              recipeCopy.firestoreId = firestoreId;
              localRecipes[0] = recipeCopy;
              localStorage.setItem('receitas_isa_user_recipes', JSON.stringify(localRecipes));
            }
          } catch (errFs) {
            console.warn('Aviso ao salvar no Firestore:', errFs);
          }
        }

        [mainBtn, stickyBtn].forEach(b => {
          if (b) {
            b.classList.add('added');
            b.innerHTML = '<span>✅</span><span>Receita adicionada ao seu site!</span>';
          }
        });

        const postActions = document.getElementById('post-add-actions');
        const openLink = document.getElementById('open-in-my-site-link');
        const syncGoogleBtn = document.getElementById('sync-google-after-add-btn');

        if (openLink) openLink.href = `recipe.html?id=${encodeURIComponent(lastSavedRecipeId)}`;
        if (postActions) postActions.classList.add('visible');
        if (syncGoogleBtn) {
          syncGoogleBtn.style.display = user ? 'none' : 'inline-flex';
        }

        if (typeof window.showToast === 'function') {
          window.showToast(`✨ "${recipeCopy.title}" foi adicionada ao seu site!`);
        }
      } catch (err) {
        console.error('Erro ao adicionar receita ao site:', err);
        [mainBtn, stickyBtn].forEach(b => {
          if (b) {
            b.disabled = false;
            b.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg><span>Adicionar esta receita ao meu site</span>';
          }
        });
      }
    }

    async function handleLoginAndSyncRecipe() {
      try {
        await signInWithPopup(auth, provider);
        const user = auth.currentUser || getUser();
        if (user && globalRecipe) {
          const syncBtn = document.getElementById('sync-google-after-add-btn');
          if (syncBtn) {
            syncBtn.disabled = true;
            syncBtn.textContent = '⏳ Salvando na sua conta...';
          }
          const firestoreId = await saveUserRecipe({
            ...globalRecipe,
            isUserCreated: true
          });
          if (firestoreId) {
            lastSavedRecipeId = firestoreId;
            const openLink = document.getElementById('open-in-my-site-link');
            if (openLink) openLink.href = `recipe.html?id=${encodeURIComponent(firestoreId)}`;
          }
          if (syncBtn) {
            syncBtn.textContent = '✅ Sincronizada na sua conta Google!';
            syncBtn.style.background = '#e6f2ef';
            syncBtn.style.color = '#1f6b5c';
          }
        }
      } catch (e) {
        console.error('Erro ao logar e sincronizar:', e);
      }
    }

    async function initSharedLanding() {
      const recipe = await resolveSharedRecipe();
      if (!recipe) {
        document.getElementById('shared-recipe-main').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh;gap:14px;text-align:center;padding:24px;">
            <div style="font-size:3.5rem;">🍽️</div>
            <h1 style="margin:0;font-size:28px;font-weight:800;color:#14110d;">Link de receita inválido ou incompleto</h1>
            <p style="margin:0;color:#6b6459;max-width:420px;">Peça para quem enviou gerar novamente o link pelo botão "Compartilhar" dentro da receita.</p>
            <a href="index.html" style="margin-top:8px;background:#ffbf00;color:#14110d;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:800;font-size:14px;">Ir para o Livro de Receitas</a>
          </div>`;
        return;
      }
      renderLandingPage(recipe);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSharedLanding);
    } else {
      initSharedLanding();
