<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  body { margin:0; background:#fff; color:#14110d; font-family:'Plus Jakarta Sans', Helvetica, sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#14110d; text-decoration:none; }
  a:hover { color:#d99f00; }
</style>
</helmet>

<div style="width:390px; margin:0 auto; background:#fff; padding-bottom:96px; position:relative; overflow:hidden">
  <header style="display:flex; align-items:center; gap:12px; padding:14px 20px; position:sticky; top:0; background:rgba(255,255,255,0.94); backdrop-filter:blur(12px); z-index:20">
    <a href="Mobile%20-%20Home.dc.html" style="width:38px; height:38px; border-radius:50%; border:2px solid #f0ebe3; display:flex; align-items:center; justify-content:center; flex-shrink:0">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
    </a>
    <span style="flex:1; font-size:14px; font-weight:800; color:#a39a8c">Categorias</span>
  </header>

  <section style="padding:8px 20px 0; position:relative">
    <div style="position:absolute; top:-10px; right:-46px; width:150px; height:150px; border-radius:50%; background:#6b7ef0; opacity:0.14; z-index:0"></div>
    <div style="position:relative; z-index:1">
      <div style="display:inline-flex; align-items:center; gap:8px; background:#fff6d9; border-radius:999px; padding:7px 14px; margin-bottom:14px">
        <div style="width:7px; height:7px; border-radius:50%; background:#ffbf00"></div>
        <span style="font-size:10px; font-weight:800; letter-spacing:0.1em; text-transform:uppercase; color:#8a6a00">32 receitas</span>
      </div>
      <h1 style="margin:0; font-size:40px; font-weight:800; letter-spacing:-0.035em; line-height:1">Café da Manhã</h1>
      <p style="margin:12px 0 0; font-size:16px; line-height:1.5; color:#6b6459; text-wrap:pretty">Comece o dia bem: panquecas, ovos, pães e tudo que combina com café fresco.</p>
    </div>
  </section>

  <section style="padding:20px 20px 0">
    <div style="position:relative; border-radius:22px; overflow:hidden; background:#f7f4ee; padding:16px; display:flex; align-items:center; gap:16px; box-shadow:0 16px 36px rgba(20,17,13,0.1)">
      <div style="width:88px; height:88px; border-radius:16px; background:repeating-linear-gradient(135deg,#f4efe6 0 10px,#efe8dc 10px 20px); flex-shrink:0; display:flex; align-items:center; justify-content:center">
        <span style="font-family:'JetBrains Mono', monospace; font-size:10px; color:#a39a8c">destaque</span>
      </div>
      <div style="min-width:0">
        <div style="font-size:10px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:#d99f00">Mais visitada da semana</div>
        <div style="font-size:17px; font-weight:800; margin-top:7px; letter-spacing:-0.015em; line-height:1.2">Panquecas de banana e aveia</div>
        <div style="display:flex; align-items:center; gap:12px; margin-top:8px; font-size:12px; font-weight:700; color:#a39a8c">
          <span style="display:flex; align-items:center; gap:5px"><span style="width:7px; height:7px; border-radius:50%; background:#ffbf00"></span>20 min</span>
          <span>310 kcal</span>
        </div>
      </div>
    </div>
  </section>

  <section style="padding:20px 20px 0">
    <div style="display:flex; align-items:center; gap:8px; overflow-x:auto; padding-bottom:4px">
      <span style="font-size:11px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:#a39a8c; white-space:nowrap; flex-shrink:0">Organizar</span>
      <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="4">
        <button style="border:2px solid #f0ebe3; background:#fff; border-radius:12px; padding:10px 15px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; flex-shrink:0" style-hover="border-color:#ffbf00">{{ s }}</button>
      </sc-for>
    </div>
  </section>

  <section style="padding:20px 20px 0">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px">
      <sc-for list="{{ recipes }}" as="r" hint-placeholder-count="8">
        <a href="Mobile%20-%20Receita.dc.html" style="display:flex; flex-direction:column">
          <div style="position:relative; border-radius:18px; overflow:hidden; aspect-ratio:1/1; background:repeating-linear-gradient(135deg,#f4efe6 0 12px,#efe8dc 12px 24px); display:flex; align-items:center; justify-content:center">
            <span style="font-family:'JetBrains Mono', monospace; font-size:10px; color:#a39a8c">foto</span>
            <span style="position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; background:#fff; color:#e14b3f; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(20,17,13,0.12)">
              <svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 15S3 11.4 3 7.6A2.9 2.9 0 0 1 9 6a2.9 2.9 0 0 1 6 1.6C15 11.4 9 15 9 15Z"></path></svg>
            </span>
          </div>
          <div style="padding:10px 2px 0">
            <div style="font-size:15px; font-weight:800; letter-spacing:-0.015em; line-height:1.25; text-wrap:pretty">{{ r.name }}</div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:7px; font-size:11px; font-weight:700; color:#a39a8c">
              <span style="display:flex; align-items:center; gap:5px"><span style="width:7px; height:7px; border-radius:50%; background:#ffbf00"></span>{{ r.time }}</span>
              <span>{{ r.kcal }}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
    <button style="width:100%; margin-top:22px; border:2px solid #e5ded2; background:#fff; font-family:inherit; font-size:15px; font-weight:800; padding:15px; border-radius:999px; cursor:pointer" style-hover="border-color:#ffbf00; background:#fffdf6">Carregar mais</button>
  </section>

  <nav style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; background:rgba(255,255,255,0.96); backdrop-filter:blur(12px); border-top:2px solid #f0ebe3; display:flex; align-items:center; justify-content:space-around; padding:10px 12px 22px; z-index:30">
    <a href="Mobile%20-%20Home.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:5px; color:#14110d">
      <svg width="21" height="21" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7.5 9 3l6 4.5V15H3z"></path></svg>
      <span style="font-size:10px; font-weight:800">Receitas</span>
    </a>
    <a href="Mobile%20-%20Planejador.dc.html" style="display:flex; flex-direction:column; align-items:center; gap:5px; color:#a39a8c">
      <svg width="21" height="21" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3.4 5.4h11.2v9.2H3.4zM3.4 8h11.2M6.4 3.4v2M11.6 3.4v2"></path></svg>
      <span style="font-size:10px; font-weight:800">Planejador</span>
    </a>
    <a href="Mobile%20-%20Nova%20Receita.dc.html" style="width:52px; height:52px; border-radius:50%; background:#ffbf00; display:flex; align-items:center; justify-content:center; margin-top:-24px; box-shadow:0 8px 20px rgba(255,191,0,0.45); color:#14110d">
      <svg width="24" height="24" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round"><path d="M9 4v10M4 9h10"></path></svg>
    </a>
    <a href="#" style="display:flex; flex-direction:column; align-items:center; gap:5px; color:#a39a8c">
      <svg width="21" height="21" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3.5 4.5h11M3.5 9h11M3.5 13.5h7"></path></svg>
      <span style="font-size:10px; font-weight:800">Compras</span>
    </a>
    <a href="#" style="display:flex; flex-direction:column; align-items:center; gap:5px; color:#a39a8c">
      <svg width="21" height="21" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 15S3 11.4 3 7.6A2.9 2.9 0 0 1 9 6a2.9 2.9 0 0 1 6 1.6C15 11.4 9 15 9 15Z"></path></svg>
      <span style="font-size:10px; font-weight:800">Favoritas</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return {
      sorts: ["Padrão", "Mais recentes", "Menor tempo", "Menos calorias"],
      recipes: [
        { name: "Panquecas de banana e aveia", time: "20 min", kcal: "310 kcal" },
        { name: "Ovos mexidos cremosos", time: "10 min", kcal: "240 kcal" },
        { name: "Rabanada com bacon e ovo", time: "25 min", kcal: "430 kcal" },
        { name: "Pão de queijo mineiro", time: "40 min", kcal: "180 kcal" },
        { name: "Tapioca de queijo coalho", time: "12 min", kcal: "220 kcal" },
        { name: "Overnight oats de frutas", time: "8 min", kcal: "290 kcal" },
        { name: "Shakshuka com pimentão", time: "30 min", kcal: "350 kcal" },
        { name: "Croissant de presunto", time: "35 min", kcal: "460 kcal" }
      ]
    };
  }
}
</script>
</body>
</html>
